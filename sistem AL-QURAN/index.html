<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{
      font-family: Arial, sans-serif;
      margin:40px;
      background:#f4f4f4;
    }

    h1{
      color:#4B0082;
    }

    button{
      padding:10px 20px;
      background:#4B0082;
      color:white;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }

    table{
      border-collapse:collapse;
      width:100%;
      margin-top:20px;
      background:white;
    }

    th,td{
      border:1px solid #ddd;
      padding:8px;
      text-align:center;
    }

    th{
      background:#4B0082;
      color:white;
    }
  </style>
</head>

<body>

<h1>Sistem Pelaporan Penguasaan Al-Quran</h1>

<button onclick="loadData()">Papar Data</button>

<div id="tableData"></div>

<script>

function loadData(){

google.script.run.withSuccessHandler(showData).getData();

}

function showData(data){

let html="<table>";

data.forEach(function(row,index){

html+="<tr>";

row.forEach(function(col){

if(index==0)
html+="<th>"+col+"</th>";
else
html+="<td>"+col+"</td>";

});

html+="</tr>";

});

html+="</table>";

document.getElementById("tableData").innerHTML=html;

}

</script>

</body>
</html>
